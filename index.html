<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Page Co. | Financial Diagnostic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: visible;
        }

        :root {
            --hw-feature-primary: #1E293B;
            --hw-feature-secondary: #F97316;
            --hw-feature-tertiary: #F1F5F9;
            --hw-feature-neutral: #64748B;
            --hw-feature-bg: #F1F5F9;
            --hw-feature-white: #ffffff;
            --hw-feature-border: #E2E8F0;
            --hw-feature-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --hw-feature-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .hw-feature-root {
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--hw-feature-primary);
            line-height: 1.5;
        }

        /* Stage 1: Floating Button */
        .hw-feature-floating-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: #F97316;
            color: var(--hw-feature-white);
            padding: 16px 24px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: var(--hw-feature-shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            min-width: 56px;
            min-height: 56px;
            pointer-events: auto;
        }

        .hw-feature-floating-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.2);
        }

        .hw-feature-bubble-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .hw-feature-floating-btn {
                padding: 16px;
                border-radius: 50%;
                bottom: 16px;
                right: 16px;
            }
            .hw-feature-bubble-text {
                display: none;
            }
        }

        /* Stage 2: Expanded Panel */
        .hw-feature-panel {
            position: absolute;
            bottom: 96px;
            right: 24px;
            width: 340px;
            max-width: calc(100vw - 48px);
            background: var(--hw-feature-bg);
            border: 1px solid var(--hw-feature-border);
            border-radius: 24px;
            box-shadow: var(--hw-feature-shadow-lg);
            padding: 32px;
            display: none;
            flex-direction: column;
            gap: 20px;
            z-index: 10000;
            animation: hw-feature-slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
            pointer-events: auto;
        }

        @media (max-width: 640px) {
            .hw-feature-panel {
                right: 16px;
                bottom: 84px;
                max-width: calc(100vw - 32px);
                padding: 24px;
            }
        }

        @keyframes hw-feature-slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hw-feature-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hw-feature-panel-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--hw-feature-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .hw-feature-header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hw-feature-header-icon {
            cursor: pointer;
            color: var(--hw-feature-neutral);
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
        }

        .hw-feature-header-icon:hover {
            background: var(--hw-feature-border);
            color: var(--hw-feature-primary);
        }

        .hw-feature-panel-text {
            font-size: 14px;
            color: var(--hw-feature-neutral);
            margin: 0;
            line-height: 1.6;
        }

        .hw-feature-btn-primary {
            background: var(--hw-feature-secondary);
            color: var(--hw-feature-white);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        .hw-feature-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.4);
            opacity: 0.95;
        }

        .hw-feature-btn-primary:disabled {
            background: var(--hw-feature-border);
            color: var(--hw-feature-neutral);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Stage 3: Modal */
        .hw-feature-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            pointer-events: none;
        }

        .hw-feature-modal {
            background: var(--hw-feature-white);
            border: 1px solid var(--hw-feature-border);
            width: 90%;
            max-width: 560px;
            border-radius: 32px;
            padding: 48px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            position: relative;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.15), 0 20px 40px -15px rgba(0, 0, 0, 0.1);
            animation: hw-feature-scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            scrollbar-width: thin;
            scrollbar-color: var(--hw-feature-border) transparent;
            pointer-events: auto;
        }

        .hw-feature-modal::-webkit-scrollbar {
            width: 6px;
        }

        .hw-feature-modal::-webkit-scrollbar-thumb {
            background: var(--hw-feature-border);
            border-radius: 10px;
        }

        @media (max-width: 640px) {
            .hw-feature-modal {
                padding: 32px 24px;
                width: calc(100vw - 24px);
                max-height: calc(100vh - 32px);
                border-radius: 24px;
            }
        }

        @keyframes hw-feature-scaleIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .hw-feature-close-modal {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 8px;
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
            color: var(--hw-feature-neutral);
            transition: all 0.2s;
            z-index: 10;
        }

        .hw-feature-close-modal:hover {
            color: var(--hw-feature-primary);
            transform: scale(1.1);
        }

        .hw-feature-progress-bar {
            height: 4px;
            background: var(--hw-feature-tertiary);
            border-radius: 2px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        @media (max-width: 640px) {
            .hw-feature-progress-bar {
                margin-bottom: 32px;
            }
        }

        .hw-feature-progress-fill {
            height: 100%;
            background: var(--hw-feature-secondary);
            width: 20%;
            transition: width 0.3s ease;
        }

        .hw-feature-step-indicator {
            font-size: 11px;
            font-weight: 700;
            color: var(--hw-feature-neutral);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            display: block;
        }

        .hw-feature-question-title {
            font-size: 28px;
            line-height: 1.3;
            font-weight: 700;
            margin-bottom: 32px;
            color: var(--hw-feature-primary);
            font-family: 'Inter', sans-serif;
        }

        @media (max-width: 640px) {
            .hw-feature-question-title {
                font-size: 22px;
                margin-bottom: 24px;
            }
        }

        .hw-feature-accent-span {
            color: var(--hw-feature-secondary);
        }

        .hw-feature-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 640px) {
            .hw-feature-options-grid {
                grid-template-columns: 1fr;
                gap: 16px;
                margin-bottom: 32px;
            }
        }

        .hw-feature-option-label {
            background: var(--hw-feature-tertiary);
            border: 1px solid var(--hw-feature-border);
            padding: 20px 24px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: flex-start;
            font-size: 15px;
            color: var(--hw-feature-primary);
            position: relative;
            min-height: 72px;
            box-sizing: border-box;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .hw-feature-option-label {
                padding: 16px 20px;
                min-height: 64px;
            }
        }

        .hw-feature-option-label:hover {
            border-color: var(--hw-feature-secondary);
            background: var(--hw-feature-white);
        }

        .hw-feature-option-label.active {
            border-color: var(--hw-feature-secondary);
            background: var(--hw-feature-white);
            box-shadow: 0 10px 15px -5px rgba(249, 115, 22, 0.1);
        }

        .hw-feature-option-input {
            display: none;
        }

        .hw-feature-custom-input-container {
            grid-column: span 1;
        }

        @media (min-width: 641px) {
            .hw-feature-custom-input-container {
                grid-column: span 2;
            }
        }

        .hw-feature-text-field {
            width: 100%;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--hw-feature-primary);
            font-family: 'Work Sans', sans-serif;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.2s;
            resize: none;
            display: block;
            margin-top: 2px;
        }

        .hw-feature-text-field:focus {
            outline: none;
        }

        .hw-feature-text-field::placeholder {
            color: var(--hw-feature-neutral);
            opacity: 0.5;
        }

        .hw-feature-modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .hw-feature-modal-footer {
                flex-direction: column-reverse;
                align-items: stretch;
                gap: 16px;
                margin-top: 32px;
            }
        }

        .hw-feature-btn-secondary {
            background: none;
            border: none;
            color: var(--hw-feature-neutral);
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hw-feature-btn-secondary:hover {
            color: var(--hw-feature-primary);
        }

        .hw-feature-btn-primary {
            background: var(--hw-feature-secondary);
            color: var(--hw-feature-white);
            padding: 16px 36px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .hw-feature-btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.4);
            opacity: 0.95;
        }

        .hw-feature-btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .hw-feature-btn-primary:disabled {
            background: var(--hw-feature-border);
            color: var(--hw-feature-neutral);
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (max-width: 640px) {
            .hw-feature-btn-primary {
                padding: 18px 24px;
                width: 100%;
            }
        }

        /* Results Styling */
        .hw-feature-results {
            display: none;
        }

        .hw-feature-result-card {
            background: var(--hw-feature-tertiary);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            border: 1px solid var(--hw-feature-border);
        }

        .hw-feature-result-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--hw-feature-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .hw-feature-result-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--hw-feature-primary);
            font-family: 'Inter', sans-serif;
        }

        .hw-feature-result-desc {
            font-size: 14px;
            color: var(--hw-feature-neutral);
            line-height: 1.6;
        }

        .hw-feature-cta {
            display: block;
            text-align: center;
            background: var(--hw-feature-secondary);
            color: var(--hw-feature-white);
            padding: 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 32px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(249, 115, 22, 0.3);
        }

        .hw-feature-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -10px rgba(249, 115, 22, 0.4);
            opacity: 0.95;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .hw-feature-panel {
                width: calc(100% - 48px);
                right: 24px;
            }
            .hw-feature-modal {
                padding: 28px;
            }
        }
    </style>
</head>
<body class="hw-feature-root">

    <!-- Stage 1: Floating Button -->
    <button class="hw-feature-floating-btn" id="hw-trigger">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="hw-feature-bubble-text">Get your financial clarity</span>
    </button>

    <!-- Stage 2: Expanded Panel -->
    <div class="hw-feature-panel" id="hw-panel">
        <div class="hw-feature-panel-header">
            <h3 class="hw-feature-panel-title">Diagnostic Widget</h3>
            <div class="hw-feature-header-actions">
                <button class="hw-feature-header-icon" id="hw-expand" title="Expand">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                </button>
                <button class="hw-feature-header-icon" id="hw-panel-close" title="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <p class="hw-feature-panel-text">Take our 2-minute assessment to identify your key financial priorities and receive immediate recommendations.</p>
        <button class="hw-feature-btn-primary" id="hw-start">Start Assessment</button>
    </div>

    <!-- Stage 3: Modal -->
    <div class="hw-feature-modal-overlay" id="hw-modal-overlay">
        <div class="hw-feature-modal">
            <span class="hw-feature-close-modal" id="hw-modal-close">&times;</span>
            
            <div id="hw-quiz-view">
                <span class="hw-feature-step-indicator" id="hw-step-label">Step 1 of 5</span>
                <div class="hw-feature-progress-bar">
                    <div class="hw-feature-progress-fill" id="hw-progress"></div>
                </div>

                <div id="hw-question-container">
                    <!-- Questions injected here -->
                </div>

                <div class="hw-feature-modal-footer">
                    <button class="hw-feature-btn-secondary" id="hw-prev" style="visibility: hidden;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Back
                    </button>
                    <button class="hw-feature-btn-primary" id="hw-next" disabled>Continue Assessment</button>
                </div>
            </div>

            <div class="hw-feature-results" id="hw-results-view">
                <h2 class="hw-feature-question-title">Your Financial Diagnostic</h2>
                
                <div class="hw-feature-result-card">
                    <div class="hw-feature-result-label">Primary Focus Area</div>
                    <div class="hw-feature-result-title" id="res-primary-title">...</div>
                    <p class="hw-feature-result-desc" id="res-primary-desc">...</p>
                </div>

                <div class="hw-feature-result-card">
                    <div class="hw-feature-result-label">Secondary Focus Area</div>
                    <div class="hw-feature-result-title" id="res-secondary-title">...</div>
                    <p class="hw-feature-result-desc" id="res-secondary-desc">...</p>
                </div>

                <div class="hw-feature-result-card">
                    <div class="hw-feature-result-label">Recommended Service</div>
                    <div class="hw-feature-result-title" id="res-service-title">...</div>
                </div>

                <a href="#" class="hw-feature-cta">Book a Free Financial Strategy Call</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const state = {
                currentStep: 0,
                answers: {},
                questions: [
                    {
                        id: 'challenge',
                        title: 'What is your biggest financial challenge?',
                        placeholder: 'Describe your situation briefly...',
                        options: [
                            { text: 'Managing existing debt', val: 'debt' },
                            { text: 'Minimizing tax liabilities', val: 'tax' },
                            { text: 'Low growth on savings', val: 'growth' },
                            { text: 'Creating a consistent budget', val: 'budget' }
                        ]
                    },
                    {
                        id: 'goal',
                        title: 'What is your primary financial goal?',
                        placeholder: 'Anything else you\'d like to mention?',
                        options: [
                            { text: 'Early retirement', val: 'retirement' },
                            { text: 'Home purchase / Real estate', val: 'home' },
                            { text: 'Funding education', val: 'education' },
                            { text: 'Protecting current wealth', val: 'preservation' }
                        ]
                    },
                    {
                        id: 'situation',
                        title: 'How would you describe your current financial situation?',
                        placeholder: 'Other / additional context...',
                        options: [
                            { text: 'Early career / Starting out', val: 'early' },
                            { text: 'Established / Mid-career', val: 'mid' },
                            { text: 'Near retirement (within 5-10 yrs)', val: 'near_ret' },
                            { text: 'High net worth / Legacy phase', val: 'hnw' }
                        ]
                    },
                    {
                        id: 'confidence',
                        title: 'How confident do you feel in your financial planning?',
                        placeholder: 'Tell us why you feel this way...',
                        options: [
                            { text: 'Not confident at all', val: 'low' },
                            { text: 'Somewhat confident, need guidance', val: 'med' },
                            { text: 'Very confident, need optimization', val: 'high' },
                            { text: 'Expert, looking for advanced strategies', val: 'expert' }
                        ]
                    },
                    {
                        id: 'concern',
                        title: 'What is your biggest concern right now?',
                        placeholder: 'Describe your specific concern...',
                        options: [
                            { text: 'Rising inflation', val: 'inflation' },
                            { text: 'Market volatility', val: 'volatility' },
                            { text: 'Income/Job stability', val: 'stability' },
                            { text: 'Wealth distribution', val: 'distribution' }
                        ]
                    }
                ]
            };

            const dom = {
                trigger: document.getElementById('hw-trigger'),
                panel: document.getElementById('hw-panel'),
                panelClose: document.getElementById('hw-panel-close'),
                expand: document.getElementById('hw-expand'),
                start: document.getElementById('hw-start'),
                modalOverlay: document.getElementById('hw-modal-overlay'),
                modal: document.querySelector('.hw-feature-modal'),
                modalClose: document.getElementById('hw-modal-close'),
                questionContainer: document.getElementById('hw-question-container'),
                nextBtn: document.getElementById('hw-next'),
                prevBtn: document.getElementById('hw-prev'),
                stepLabel: document.getElementById('hw-step-label'),
                progress: document.getElementById('hw-progress'),
                quizView: document.getElementById('hw-quiz-view'),
                resultsView: document.getElementById('hw-results-view')
            };

            // UI Transitions
            dom.trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                dom.panel.style.display = dom.panel.style.display === 'flex' ? 'none' : 'flex';
            });

            dom.panelClose.addEventListener('click', (e) => {
                e.stopPropagation();
                dom.panel.style.display = 'none';
            });

            const openModal = (e) => {
                if (e) e.stopPropagation();
                dom.panel.style.display = 'none';
                dom.trigger.style.display = 'none';
                dom.modalOverlay.style.display = 'flex';
                renderStep();
            };

            const closeModal = () => {
                dom.modalOverlay.style.display = 'none';
                dom.trigger.style.display = 'flex';
            };

            dom.expand.addEventListener('click', openModal);
            dom.start.addEventListener('click', openModal);

            dom.modalClose.addEventListener('click', closeModal);

            // Outside click closing
            window.addEventListener('click', (e) => {
                // If panel is open and click is outside panel and trigger
                if (dom.panel.style.display === 'flex') {
                    if (!dom.panel.contains(e.target) && !dom.trigger.contains(e.target)) {
                        dom.panel.style.display = 'none';
                    }
                }
                
                // If modal is open and click is outside modal (but on overlay since overlay is full screen)
                // Note: Overlay has pointer-events: none, but we can detect clicks on the overlay if we change it
                // Or we can just check if the click target is the overlay background.
                // Actually, since pointer-events: none is on overlay, clicks pass through.
                // We want clicks that HIT THE OVERLAY (the empty space) to close it.
                // I'll change overlay to pointer-events: auto and modal to pointer-events: auto.
            });

            // Re-adjust overlay click handling
            dom.modalOverlay.style.pointerEvents = 'auto';
            dom.modalOverlay.addEventListener('click', (e) => {
                if (e.target === dom.modalOverlay) {
                    closeModal();
                }
            });

            // Logic Helpers
            function renderStep() {
                const q = state.questions[state.currentStep];
                dom.stepLabel.innerText = `Step ${state.currentStep + 1} of ${state.questions.length}`;
                dom.progress.style.width = `${((state.currentStep + 1) / state.questions.length) * 100}%`;
                
                // Enhance title with accent span
                let enrichedTitle = q.title;
                const keywords = ['biggest', 'primary', 'current', 'confident', 'right now'];
                keywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, 'gi');
                    enrichedTitle = enrichedTitle.replace(regex, '<span class="hw-feature-accent-span">$1</span>');
                });

                let html = `<h2 class="hw-feature-question-title">${enrichedTitle}</h2>`;
                html += `<div class="hw-feature-options-grid">`;
                
                const currentAnswer = state.answers[q.id] || {};

                q.options.forEach((opt, idx) => {
                    const isChecked = !currentAnswer.isCustom && currentAnswer.val === opt.val;
                    const num = (idx + 1).toString().padStart(2, '0');
                    html += `
                        <label class="hw-feature-option-label ${isChecked ? 'active' : ''}">
                            <input type="radio" name="${q.id}" value="${opt.val}" class="hw-feature-option-input" ${isChecked ? 'checked' : ''}>
                            <div style="flex-grow: 1;">
                                <div style="color: var(--hw-feature-secondary); font-size: 11px; font-weight: 700; margin-bottom: 4px; font-family: 'Inter', sans-serif;">${num}</div>
                                <div>${opt.text}</div>
                            </div>
                        </label>
                    `;
                });
                
                // Custom "Other" option as the 5th item
                const isCustomActive = currentAnswer.isCustom && currentAnswer.val;
                html += `
                    <div class="hw-feature-custom-input-container">
                        <div class="hw-feature-option-label ${isCustomActive ? 'active' : ''}" id="hw-custom-trigger">
                            <div style="flex-grow: 1; width: 100%;">
                                <div style="color: var(--hw-feature-secondary); font-size: 11px; font-weight: 700; margin-bottom: 4px; font-family: 'Inter', sans-serif;">05</div>
                                <textarea class="hw-feature-text-field" id="hw-other-input" rows="1" placeholder="${q.placeholder}">${currentAnswer.isCustom ? currentAnswer.val : ''}</textarea>
                            </div>
                        </div>
                    </div>
                `;

                html += `</div>`;

                dom.questionContainer.innerHTML = html;
                dom.prevBtn.style.visibility = state.currentStep === 0 ? 'hidden' : 'visible';
                dom.nextBtn.innerText = state.currentStep === state.questions.length - 1 ? 'Finish' : 'Continue Assessment';
                updateNextState();

                // Bind events
                dom.questionContainer.querySelectorAll('input').forEach(input => {
                    input.addEventListener('change', (e) => {
                        state.answers[q.id] = { val: e.target.value, isCustom: false };
                        renderStep(); 
                    });
                });

                const otherInput = document.getElementById('hw-other-input');
                const customTrigger = document.getElementById('hw-custom-trigger');

                if (otherInput) {
                    otherInput.addEventListener('input', (e) => {
                        const val = e.target.value;
                        state.answers[q.id] = { val: val, isCustom: true };
                        
                        // Sync UI classes without full re-render for better typing experience
                        dom.questionContainer.querySelectorAll('.hw-feature-option-label').forEach(l => l.classList.remove('active'));
                        dom.questionContainer.querySelectorAll('input').forEach(i => i.checked = false);
                        
                        if (val.trim()) {
                            customTrigger.classList.add('active');
                        } else {
                            customTrigger.classList.remove('active');
                        }
                        updateNextState();

                        // Auto-expand
                        e.target.style.height = 'auto';
                        e.target.style.height = (e.target.scrollHeight) + 'px';
                    });

                    otherInput.addEventListener('focus', () => {
                        // Optional: trigger selection on focus if empty
                    });

                    if (currentAnswer.isCustom && currentAnswer.val) {
                        otherInput.style.height = 'auto';
                        otherInput.style.height = (otherInput.scrollHeight) + 'px';
                    }
                }

                if (customTrigger) {
                    customTrigger.addEventListener('click', (e) => {
                        if (e.target !== otherInput) {
                            otherInput.focus();
                        }
                    });
                }
            }

            function updateNextState() {
                const q = state.questions[state.currentStep];
                const ans = state.answers[q.id];
                dom.nextBtn.disabled = !ans || !ans.val || (ans.isCustom && !ans.val.trim());
            }

            dom.nextBtn.addEventListener('click', () => {
                if (state.currentStep < state.questions.length - 1) {
                    state.currentStep++;
                    renderStep();
                } else {
                    showResults();
                }
            });

            dom.prevBtn.addEventListener('click', () => {
                if (state.currentStep > 0) {
                    state.currentStep--;
                    renderStep();
                }
            });

            function showResults() {
                dom.quizView.style.display = 'none';
                dom.resultsView.style.display = 'block';

                const a = state.answers;
                let primary = { title: '', desc: '', service: '' };
                let secondary = { title: '', desc: '' };

                // Interpretation Logic
                if (a.challenge.val === 'debt') {
                    primary = {
                        title: 'Debt Optimization',
                        desc: 'Your biggest hurdle is high-interest liability. Reducing your debt cost is the fastest way to improve your net worth.',
                        service: 'Debt restructuring advice'
                    };
                } else if (a.situation.val === 'hnw' || a.goal.val === 'preservation') {
                    primary = {
                        title: 'Wealth Preservation',
                        desc: 'With significant assets, your focus should be on sophisticated risk management and tax-efficient growth.',
                        service: 'Investment strategy review'
                    };
                } else if (a.situation.val === 'near_ret' || a.goal.val === 'retirement') {
                    primary = {
                        title: 'Retirement Readiness',
                        desc: 'You are entering a critical transition phase. Shifting from accumulation to distribution requires specialized planning.',
                        service: 'Retirement planning consultation'
                    };
                } else if (a.confidence.val === 'low') {
                    primary = {
                        title: 'Foundational Planning',
                        desc: 'Complexity is preventing clarity. A formal roadmap will establish the targets needed for your long-term success.',
                        service: 'Financial roadmap session'
                    };
                } else {
                    primary = {
                        title: 'Cash Flow Efficiency',
                        desc: 'Your current structure is stable but likely inefficient. Optimizing where every dollar goes will accelerate your goals.',
                        service: 'Cash flow optimization'
                    };
                }

                // Secondary Focus
                if (a.concern.val === 'tax' || a.challenge.val === 'tax') {
                    secondary = {
                        title: 'Tax Efficiency',
                        desc: 'Your feedback indicates that tax drag is a major concern. Strategic positioning could save significant overhead.'
                    };
                } else if (a.concern.val === 'inflation') {
                    secondary = {
                        title: 'Inflation Protection',
                        desc: 'Protecting your purchasing power is vital. We recommend reviewing your asset allocation against rising costs.'
                    };
                } else {
                    secondary = {
                        title: 'Strategic Growth',
                        desc: 'Ensuring your capital is working as hard as possible is key to your secondary objectives.'
                    };
                }

                document.getElementById('res-primary-title').innerText = primary.title;
                document.getElementById('res-primary-desc').innerText = primary.desc;
                document.getElementById('res-secondary-title').innerText = secondary.title;
                document.getElementById('res-secondary-desc').innerText = secondary.desc;
                document.getElementById('res-service-title').innerText = primary.service;
            }
        })();
    </script>
</body>
</html>
